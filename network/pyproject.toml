[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-network"
version = "0.3.0"
description = "Virtual enterprise network generator for the self-healing network project (Submodule 1.2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# Module 4 failure prediction (models, registry, live predictor)
ml = ["numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3"]

[project.scripts]
enterprise-net = "network.launcher:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
