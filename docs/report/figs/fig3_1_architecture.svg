<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 712" font-family="Times New Roman, Liberation Serif, serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect x="265.0" y="10" width="220" height="34" rx="16" fill="#fff" stroke="#333"/><text x="375.0" y="32.0" text-anchor="middle" font-size="15" font-weight="normal">Network operator (web browser)</text><line x1="375.0" y1="44" x2="375.0" y2="70" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="20" y="70" width="710" height="86" fill="#f6f6f6" stroke="#777"/><text x="30" y="88" font-size="14.5" font-weight="bold">1. Presentation Layer</text><rect x="60" y="98" width="220" height="48" rx="2" fill="#fff" stroke="#333"/><text x="170.0" y="118.0" text-anchor="middle" font-size="15" font-weight="normal">Login page</text><text x="170.0" y="136.0" text-anchor="middle" font-size="15" font-weight="normal">operator session (HttpOnly cookie)</text><rect x="320" y="98" width="330" height="48" rx="2" fill="#fff" stroke="#333"/><text x="485.0" y="118.0" text-anchor="middle" font-size="15" font-weight="normal">Dashboard (FastAPI + JavaScript)</text><text x="485.0" y="136.0" text-anchor="middle" font-size="15" font-weight="normal">topology, charts, approvals, controls</text><line x1="375.0" y1="156" x2="375.0" y2="186" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="383.0" y="176" font-size="13.5" font-style="italic" text-anchor="start">status, approvals, operator actions</text><rect x="20" y="186" width="710" height="132" fill="#f6f6f6" stroke="#777"/><text x="30" y="204" font-size="14.5" font-weight="bold">2. Intelligence Layer</text><rect x="40" y="222" width="160" height="52" rx="2" fill="#fff" stroke="#333"/><text x="120.0" y="244.0" text-anchor="middle" font-size="15" font-weight="bold">Failure Prediction</text><text x="120.0" y="262.0" text-anchor="middle" font-size="15" font-weight="normal">z-score / logistic</text><rect x="215" y="222" width="160" height="52" rx="2" fill="#fff" stroke="#333"/><text x="295.0" y="244.0" text-anchor="middle" font-size="15" font-weight="bold">Zero Trust Engine</text><text x="295.0" y="262.0" text-anchor="middle" font-size="15" font-weight="normal">trust Eq. 2, threat Eq. 3</text><rect x="390" y="222" width="160" height="52" rx="2" fill="#fff" stroke="#333"/><text x="470.0" y="244.0" text-anchor="middle" font-size="15" font-weight="bold">Decision Engine</text><text x="470.0" y="262.0" text-anchor="middle" font-size="15" font-weight="normal">risk Eq. 4, paths Eq. 6</text><rect x="565" y="222" width="160" height="52" rx="2" fill="#fff" stroke="#333"/><text x="645.0" y="244.0" text-anchor="middle" font-size="15" font-weight="bold">Self-Healing Engine</text><text x="645.0" y="262.0" text-anchor="middle" font-size="15" font-weight="normal">execute, verify, roll back</text><line x1="375" y1="248" x2="390" y2="248" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="565" y1="248" x2="565" y2="248" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="550" y1="248" x2="565" y2="248" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><path d="M120,274 v26 h350 v-26" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="295" y="296" font-size="13" font-style="italic" text-anchor="middle">failure scores</text><rect x="20" y="350" width="710" height="96" fill="#f6f6f6" stroke="#777"/><text x="30" y="368" font-size="14.5" font-weight="bold">3. Data and Analytics Layer</text><rect x="140" y="380" width="260" height="50" rx="2" fill="#fff" stroke="#333"/><text x="270.0" y="401.0" text-anchor="middle" font-size="15" font-weight="bold">Telemetry Collector</text><text x="270.0" y="419.0" text-anchor="middle" font-size="15" font-weight="normal">health evaluation, derived rates</text><path d="M450,386 a95.0,8 0 0 1 190,0 v40 a95.0,8 0 0 1 -190,0 z" fill="#fff" stroke="#333"/><path d="M450,386 a95.0,8 0 0 0 190,0" fill="none" stroke="#333"/><text x="545.0" y="402.0" text-anchor="middle" font-size="15" font-weight="normal">SQLite history</text><text x="545.0" y="420.0" text-anchor="middle" font-size="15" font-weight="normal">features, baselines</text><line x1="400" y1="405" x2="450" y2="405" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="270" y1="380" x2="270" y2="320" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="278" y="342" font-size="13.5" font-style="italic" text-anchor="start">measurements, health, features</text><rect x="20" y="478" width="710" height="96" fill="#f6f6f6" stroke="#777"/><text x="30" y="496" font-size="14.5" font-weight="bold">4. Control Layer</text><rect x="80" y="508" width="250" height="50" rx="2" fill="#fff" stroke="#333"/><text x="205.0" y="529.0" text-anchor="middle" font-size="15" font-weight="bold">NetworkController</text><text x="205.0" y="547.0" text-anchor="middle" font-size="15" font-weight="normal">FailureManager</text><rect x="380" y="508" width="270" height="50" rx="2" fill="#fff" stroke="#333"/><text x="515.0" y="529.0" text-anchor="middle" font-size="15" font-weight="bold">Self-healing Ryu app</text><text x="515.0" y="547.0" text-anchor="middle" font-size="15" font-weight="normal">OpenFlow 1.3 + REST API</text><line x1="515" y1="508" x2="350" y2="432" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="445" y="470" font-size="13.5" font-style="italic" text-anchor="start">port stats, link probes, flow records</text><rect x="20" y="606" width="710" height="96" fill="#f6f6f6" stroke="#777"/><text x="30" y="624" font-size="14.5" font-weight="bold">5. Data Plane</text><rect x="40" y="636" width="190" height="50" rx="2" fill="#fff" stroke="#333"/><text x="135.0" y="657.0" text-anchor="middle" font-size="15" font-weight="normal">Mininet hosts, servers</text><text x="135.0" y="675.0" text-anchor="middle" font-size="15" font-weight="normal">(real traffic, attacks)</text><rect x="255" y="636" width="180" height="50" rx="2" fill="#fff" stroke="#333"/><text x="345.0" y="657.0" text-anchor="middle" font-size="15" font-weight="normal">Open vSwitch</text><text x="345.0" y="675.0" text-anchor="middle" font-size="15" font-weight="normal">rtr-core, sw-a, sw-b</text><rect x="460" y="636" width="190" height="50" rx="2" fill="#fff" stroke="#333"/><text x="555.0" y="657.0" text-anchor="middle" font-size="15" font-weight="normal">Simulated data plane</text><text x="555.0" y="675.0" text-anchor="middle" font-size="15" font-weight="normal">(simulation mode)</text><line x1="205" y1="558" x2="160" y2="636" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="515" y1="558" x2="345" y2="636" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="440" y="600" font-size="13.5" font-style="italic" text-anchor="start">OpenFlow rules</text><path d="M725,248 H770 V533 H650" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="778" y="390" font-size="13.5" font-style="italic">verified actions:</text><text x="778" y="407" font-size="13.5" font-style="italic">restore, reroute,</text><text x="778" y="424" font-size="13.5" font-style="italic">block, quarantine</text></svg>